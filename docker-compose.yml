#
#--------------------------------------------------------------------------
# docker-compose.yml
#--------------------------------------------------------------------------
#
# Here is where you can play around with your container stacks
# Feel free to modify it base on your need.
#
# notes:
# set {PROJECTS_PATH} in .env file and must be in linux format.
# put your working php projects inside PROJECTS_PATH dir
# port 80/443 => using php-fpm 8.4
# port 8070 => using php-fpm 7.1
# port 8074 => using php-fpm 7.4
#

services:
  nginx:
    image: nginx:local
    container_name: nginx
    restart: unless-stopped
    volumes:
      - ${PROJECTS_PATH}:/var/www/html
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./config/nginx/entrypoint-auto.conf:/etc/nginx/entrypoint-auto.conf
      - ./config/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./config/nginx/fastcgi_params:/etc/nginx/fastcgi_params
    network_mode: host
    depends_on:
      - php71
      - php74
      - php84

  php71:
    image: php71:local
    container_name: php71
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE
    volumes:
      - ${PROJECTS_PATH}:/var/www/html
      - ./config/php/v71/zz-docker.conf:/usr/local/etc/php-fpm.d/zz-docker.conf
    environment:
      - TZ=Asia/Jakarta
    network_mode: host

  php74:
    image: php74:local
    container_name: php74
    restart: unless-stopped
    volumes:
      - ${PROJECTS_PATH}:/var/www/html
      - ./config/php/v74/zz-docker.conf:/usr/local/etc/php-fpm.d/zz-docker.conf
    environment:
      - TZ=Asia/Jakarta
    network_mode: host

  php84:
    image: php84:local
    container_name: php84
    restart: unless-stopped
    volumes:
      - ${PROJECTS_PATH}:/var/www/html
      - ./config/php/v84/zz-docker.conf:/usr/local/etc/php-fpm.d/zz-docker.conf
    environment:
      - TZ=Asia/Jakarta
    network_mode: host

  pgsql:
    image: postgres:18.1-alpine
    container_name: pgsql
    restart: unless-stopped
    environment:
      # Default credentials
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./config/pgsql/pg_hba.conf:/var/lib/postgresql/data/pg_hba.conf
      - pgsql_data:/var/lib/postgresql/data
    networks:
      - local-network

networks:
  local-network:
    external: true

volumes:
  pgsql_data:
